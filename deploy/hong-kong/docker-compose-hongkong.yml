# Production stack for a host-managed Nginx and Certbot setup.
#
# Public traffic flow:
#   host Nginx :80/:443 -> 127.0.0.1:8371 -> app container :3000
#
# This stack intentionally does not run an Nginx container. TLS certificates,
# HTTP redirects, and virtual hosts remain managed by the host operating system.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zephyr_hub
      POSTGRES_USER: zephyr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zephyr -d zephyr_hub"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hub-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hub-internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [hub-internal]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/zephyr-hub-logs
        rules="$$(mc ilm rule ls --json local/zephyr-hub-logs 2>/dev/null || true)"
        if ! printf '%s' "$$rules" | tr -d '[:space:]' | grep -q '"Days":30'; then
          mc ilm rule add --expire-days 30 local/zephyr-hub-logs
        fi
    networks: [hub-internal]

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: zephyr-hub:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ${HUB_ENV_FILE:-.env}
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?set NUXT_DATABASE_URL}
      NUXT_REDIS_URL: redis://redis:6379/0
      NUXT_S3_ENDPOINT: http://minio:9000
      NUXT_S3_BUCKET: zephyr-hub-logs
      NUXT_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      NUXT_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      NUXT_S3_FORCE_PATH_STYLE: "true"
      # Requests published through 127.0.0.1 reach the container from the
      # Docker bridge gateway. Only that gateway may supply forwarded IPs.
      NUXT_TRUSTED_PROXY_CIDRS: ${NUXT_TRUSTED_PROXY_CIDRS:-172.30.0.1/32}
    ports:
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_HOST_PORT:-8371}:3000"
    networks: [hub-internal]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/zephyr-alerts.yml:/etc/prometheus/zephyr-alerts.yml:ro
      - ${METRICS_TOKEN_FILE:-.metrics-token}:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    networks: [hub-internal]

  backup:
    build:
      context: ../backup
      dockerfile: Dockerfile
    profiles: [backup]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: ${HUB_ENV_FILE:-.env}
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:?set NUXT_DATABASE_URL}
      NUXT_REDIS_URL: redis://redis:6379/0
      NUXT_S3_ENDPOINT: http://minio:9000
      NUXT_S3_BUCKET: zephyr-hub-logs
      NUXT_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      NUXT_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - backup-data:/backups
    networks: [hub-internal]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  backup-data:

networks:
  hub-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
