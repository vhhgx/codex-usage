# Host-managed Nginx vhost for docker-compose-hongkong.yml.
#
# The certificate paths below assume the certificate files are stored in the
# repository's ignored deploy/hong-kong/tls directory. Replace both paths
# before enabling this vhost if Certbot manages the certificates elsewhere.
# For example:
#   /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
#   /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

log_format zephyr_hub_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

upstream zephyr_hub_host {
    server 127.0.0.1:8371;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate /root/apps/zephry-hub/deploy/hong-kong/tls/fullchain.pem;
    ssl_certificate_key /root/apps/zephry-hub/deploy/hong-kong/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZEPHYR_HOST_TLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/zephyr-hub-access.log zephyr_hub_json;
    client_max_body_size 50m;
    client_body_timeout 60s;

    location = /api/health {
        access_log off;
        return 404;
    }

    location / {
        proxy_pass http://zephyr_hub_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
    }
}
